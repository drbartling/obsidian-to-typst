name: test

on: push

jobs:
  unit-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: Linux, python: '3.14', os: ubuntu-latest}
        - {name: Windows, python: '3.14', os: windows-latest}
        - {name: Mac, python: '3.14', os: macos-latest}
        - {name: '3.13', python: '3.13', os: ubuntu-latest}
        - {name: '3.12', python: '3.12', os: ubuntu-latest}
        - {name: '3.11', python: '3.11', os: ubuntu-latest}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - uses: cargo-bins/cargo-binstall@main
    - name: Install Typst
      run: just install-typst
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install mermaid-cli
      run: npm install -g @mermaid-js/mermaid-cli
    - name: Allow Chrome sandbox on Ubuntu 24.04+
      if: runner.os == 'Linux'
      run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
    - name: Run tests
      run: just test
